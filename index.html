<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>VocabMaster - 英文單字練習</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="max-w-2xl mx-auto px-4 py-8">
    
    <header class="text-center mb-8">
        <h1 class="text-3xl font-bold text-slate-800 tracking-tight">VocabMaster</h1>
        <p class="text-slate-500 mt-2">精準練習，掌握每一個單字</p>
    </header>

    <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
        <div class="flex gap-2">
            <button id="shuffleBtn" class="btn-hover flex items-center gap-2 px-4 py-2 bg-white text-slate-700 rounded-xl shadow-sm text-sm font-semibold">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="7.5 4.21 12 6.81 16.5 4.21"></polyline><polyline points="7.5 19.79 7.5 14.6 3 12"></polyline><polyline points="21 12 16.5 14.6 16.5 19.79"></polyline><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                重新洗牌
            </button>
            <button id="favoriteViewBtn" class="btn-hover flex items-center gap-2 px-4 py-2 bg-white text-slate-700 rounded-xl shadow-sm text-sm font-semibold">
                <span id="favIcon">☆</span>
                <span id="favText">收藏模式</span>
            </button>
        </div>
        <button id="resetAllBtn" class="btn-hover px-4 py-2 text-slate-400 hover:text-red-500 text-sm font-medium transition-colors">
            清除所有紀錄
        </button>
    </div>

    <section class="glass-card rounded-2xl p-5 mb-6 shadow-sm">
        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">選擇練習課程</h2>
        <div class="flex flex-wrap gap-4" id="lessonCheckboxes">
        </div>
    </section>

    <div class="mb-4">
        <div class="flex justify-between items-end mb-2">
            <span class="text-sm font-bold text-blue-600" id="wordCounter">第 0 / 0 題</span>
            <span class="text-xs text-slate-400" id="progressPercent">0%</span>
        </div>
        <div class="progress-bar">
            <div id="progressFill" class="progress-fill" style="width: 0%"></div>
        </div>
    </div>

    <div id="cardsContainer" class="min-h-[300px]">
    </div>

    <p class="text-center text-slate-400 text-xs mt-8">
        提示：輸入後按「Enter」可快速檢查答案
    </p>
</div>

<script src="script.js"></script>

</body>
</html>
